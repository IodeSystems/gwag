[project]
name = "gwag-events-schemaregistry"
version = "0.0.0"
description = "Confluent Schema Registry Serde for the gwag Python events runtime. Not published."
requires-python = ">=3.12"
dependencies = [
    "gwag-events",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "mypy==1.20.0",
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
    # Interop tests only (SR_URL / KAFKA_BROKERS set): the Kafka backend.
    "gwag-events-kafka",
]

[tool.uv.sources]
gwag-events = { path = "../gwag-events", editable = true }
gwag-events-kafka = { path = "../gwag-events-kafka", editable = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwag_events_schemaregistry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true

# aiokafka ships no type information.
[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true
