[project]
name = "gwag-registration"
version = "0.0.0"
description = "Light registration client for gwag's control plane: announce, wait for ok, heartbeat, deregister. Not published."
requires-python = ">=3.12"
dependencies = [
    "betterproto2[grpclib]==0.10.0",
]

[dependency-groups]
dev = [
    "betterproto2-compiler==0.10.1",
    "mypy==1.20.0",
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwag_registration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true

# betterproto2's own message_pool.py calls its untyped MessagePool().
# Generated by the pinned compiler; not ours to edit.
[[tool.mypy.overrides]]
module = "gwag_registration.gen.message_pool"
disallow_untyped_calls = false
