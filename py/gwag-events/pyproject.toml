[project]
name = "gwag-events"
version = "0.0.0"
description = "Runtime for typed gwag event channels generated by `gwag gen --lang python`. Not published."
requires-python = ">=3.12"
dependencies = [
    "nats-py==2.16.0",
]

[dependency-groups]
dev = [
    "mypy==1.20.0",
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwag_events"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
