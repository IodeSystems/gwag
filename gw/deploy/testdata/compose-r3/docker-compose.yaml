# Generated by gwag deploy export. Run: docker compose up -d
# Nodes: 3. Host ports: HTTP 8080, control plane 50090, NATS client 14222 (+1 per node).
name: gwag
services:
  gwag-1:
    image: example.com/gwag:v1
    restart: unless-stopped
    command:
      - "up"
      - "--data-dir=/data"
      - "--no-context-write"
      - "--addr=:8080"
      - "--control-plane=:50090"
      - "--nats-listen=:14222"
      - "--nats-cluster=:14248"
      - "--node-name=gwag-1"
      - "--shutdown-delay=10s"
      - "--shutdown-timeout=30s"
      - "--nats-peer=gwag-2:14248"
      - "--nats-peer=gwag-3:14248"
    env_file: ./secrets/gwag.env
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50090:50090"
      - "127.0.0.1:14222:14222"
    volumes:
      - gwag-1-data:/data
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/gwag", "probe", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
  gwag-2:
    image: example.com/gwag:v1
    restart: unless-stopped
    command:
      - "up"
      - "--data-dir=/data"
      - "--no-context-write"
      - "--addr=:8080"
      - "--control-plane=:50090"
      - "--nats-listen=:14222"
      - "--nats-cluster=:14248"
      - "--node-name=gwag-2"
      - "--shutdown-delay=10s"
      - "--shutdown-timeout=30s"
      - "--nats-peer=gwag-1:14248"
      - "--nats-peer=gwag-3:14248"
    env_file: ./secrets/gwag.env
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:50091:50090"
      - "127.0.0.1:14223:14222"
    volumes:
      - gwag-2-data:/data
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/gwag", "probe", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
  gwag-3:
    image: example.com/gwag:v1
    restart: unless-stopped
    command:
      - "up"
      - "--data-dir=/data"
      - "--no-context-write"
      - "--addr=:8080"
      - "--control-plane=:50090"
      - "--nats-listen=:14222"
      - "--nats-cluster=:14248"
      - "--node-name=gwag-3"
      - "--shutdown-delay=10s"
      - "--shutdown-timeout=30s"
      - "--nats-peer=gwag-1:14248"
      - "--nats-peer=gwag-2:14248"
    env_file: ./secrets/gwag.env
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:50092:50090"
      - "127.0.0.1:14224:14222"
    volumes:
      - gwag-3-data:/data
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/gwag", "probe", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
volumes:
  gwag-1-data:
  gwag-2-data:
  gwag-3-data:
