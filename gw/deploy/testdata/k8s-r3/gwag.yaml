# Generated by gwag deploy export (k8s, 3 nodes).
# Apply in order: namespace.yaml, secrets/secret.yaml, gwag.yaml.
apiVersion: v1
kind: Service
metadata:
  name: gwag-peers
  namespace: gwag
  labels:
    app.kubernetes.io/name: gwag
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: gwag
  ports:
    - {name: http, port: 8080}
    - {name: control-plane, port: 50090}
    - {name: nats-client, port: 14222}
    - {name: nats-cluster, port: 14248}
---
# Ready pods only. Use this name from inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: gwag
  namespace: gwag
  labels:
    app.kubernetes.io/name: gwag
spec:
  selector:
    app.kubernetes.io/name: gwag
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: control-plane, port: 50090, targetPort: control-plane}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gwag
  namespace: gwag
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gwag
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gwag
  namespace: gwag
  labels:
    app.kubernetes.io/name: gwag
spec:
  serviceName: gwag-peers
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: gwag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gwag
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gwag
      containers:
        - name: gwag
          image: example.com/gwag:v1
          imagePullPolicy: IfNotPresent
          args:
            - "up"
            - "--data-dir=/data"
            - "--no-context-write"
            - "--addr=:8080"
            - "--control-plane=:50090"
            - "--nats-listen=:14222"
            - "--nats-cluster=:14248"
            - "--node-name=$(POD_NAME)"
            - "--shutdown-delay=10s"
            - "--shutdown-timeout=30s"
            - "--nats-peer=gwag-0.gwag-peers.gwag.svc:14248"
            - "--nats-peer=gwag-1.gwag-peers.gwag.svc:14248"
            - "--nats-peer=gwag-2.gwag-peers.gwag.svc:14248"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GWAG_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gwag-admin
                  key: token
          ports:
            - {name: http, containerPort: 8080}
            - {name: control-plane, containerPort: 50090}
            - {name: nats-client, containerPort: 14222}
            - {name: nats-cluster, containerPort: 14248}
          # 200 only when serving. 503 while starting or draining.
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          # A node without a meta leader reports 503 starting for as
          # long as its peers are down. Liveness must not kill it, so
          # it checks the port only, after the startup probe passes.
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
            failureThreshold: 150
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
