syntax = "proto3";

package gwag.ps.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/iodesystems/gwag/v2/gw/proto/ps/v1;psv1";

// ChannelBinding is the proto-declarative payload-type binding the
// gateway extracts at slot bake. A message whose options carry
// `(gwag.ps.binding) = { pattern: "events.orders.*.update" }` declares
// that any event delivered on a channel matching `pattern` is wire-
// compatible with that message. The pattern grammar is NATS-style
// (segments split on `.`, `*` matches one segment, `>` matches the
// rest), identical to the grammar `WithChannelAuth` uses.
//
// The binding rides in the proto's source bytes — both the boot-time
// `AddProto` path and the control-plane `proto_source` path carry the
// extension end-to-end without a side channel. The gateway aggregates
// across all registered slots into a pattern→message-FQN lookup;
// matched events get their `Event.payload_type` stamped at delivery
// so subscribers can cross-reference the descriptor in
// `/schema/proto?service=...` for decoding.
message ChannelBinding {
  // NATS-style channel subject pattern this message binds to. Required.
  string pattern = 1;

  // Channel name. Generated event code names its typed calls after it
  // (onName / publishName); the channel key is
  // "<proto package>.<name>". Several messages in one package may
  // share a name and pattern: the channel then carries any of them
  // and the Gwag-Type header says which (a union). Empty = an
  // unnamed binding (payload typing only, no generated calls).
  //
  // The pattern may name its wildcard segments: "events.orders.{orderId}"
  // matches like "events.orders.*" and generated code takes and
  // reports orderId.
  string name = 2;
}

extend google.protobuf.MessageOptions {
  // Custom option in the 50000–99999 range reserved for internal use
  // (per protobuf descriptor.proto guidance — production options would
  // request a globally-unique number from the protobuf registry; this
  // one is gateway-internal so the in-house range is correct).
  optional ChannelBinding binding = 51234;
}

// Shadow declares that a message is gwag's copy of a message another
// team owns in a Confluent Schema Registry. `gwag schema check` reads
// it and compares the two. The gateway and generated code ignore it.
//
//   option (gwag.ps.v1.shadow) = {
//     registry: "corp"          // a name; --registry corp=URL gives the URL
//     subject: "orders-value"
//     version: "latest"         // or "3"
//   };
//
// The registry URL is not in the proto, so one proto serves every
// environment.
message Shadow {
  // Registry name. `gwag schema check --registry NAME=URL` maps it to
  // a URL. Required.
  string registry = 1;
  // Schema Registry subject, e.g. "orders-value". Required.
  string subject = 2;
  // Subject version: "latest" (default) or a number.
  string version = 3;
  // Full name of the registry message this message copies. Default:
  // the registry message with the same simple name, else the schema's
  // first message.
  string message = 4;
  // Side says which way gwag uses the topic.
  enum Side {
    // gwag reads the topic. The copy may leave fields out; every field
    // it keeps must match the registry's (number, type, cardinality,
    // enum values). A field the registry does not have is an error.
    CONSUMER = 0;
    // gwag writes the topic. The registry's compatibility API must
    // accept the copy at the subject's compatibility level.
    PRODUCER = 1;
  }
  Side side = 5;
}

extend google.protobuf.MessageOptions {
  optional Shadow shadow = 51235;
}
