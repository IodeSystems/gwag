# Front load balancer of the cutover example.
#
# :10000  clients. Route weights blue/green come from the runtime keys
#         routing.gw.blue and routing.gw.green (static layer below:
#         100/0). The external switch changes them through the admin
#         API, with no reload and no connection closed:
#           curl -X POST 'http://envoy:9901/runtime_modify?routing.gw.blue=0&routing.gw.green=100'
# :10001  green only: blue's switchover target and replay verify target.
# :9901   admin.
#
# Both clusters health check /api/health every second; a node is out
# after 2 failed checks (2 s), under the gateways' --shutdown-delay.
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

layered_runtime:
  layers:
    - name: static
      static_layer:
        routing.gw.blue: 100
        routing.gw.green: 0
    - name: admin
      admin_layer: {}

static_resources:
  listeners:
    - name: public
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: public
                route_config:
                  name: public
                  virtual_hosts:
                    - name: gw
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            timeout: 60s
                            weighted_clusters:
                              runtime_key_prefix: routing.gw
                              clusters:
                                - { name: blue, weight: 100 }
                                - { name: green, weight: 0 }
                          response_headers_to_add:
                            - header: { key: x-gw-cluster, value: "%UPSTREAM_CLUSTER%" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: green_internal
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: green_internal
                route_config:
                  name: green_internal
                  virtual_hosts:
                    - name: green
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: green, timeout: 60s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: blue
      type: STRICT_DNS
      connect_timeout: 1s
      dns_refresh_rate: 1s
      respect_dns_ttl: false
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      health_checks:
        - timeout: 1s
          interval: 1s
          no_traffic_interval: 1s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /api/health }
      load_assignment:
        cluster_name: blue
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: blue-0, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: blue-1, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: blue-2, port_value: 8080 } } }
    - name: green
      type: STRICT_DNS
      connect_timeout: 1s
      dns_refresh_rate: 1s
      respect_dns_ttl: false
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      health_checks:
        - timeout: 1s
          interval: 1s
          no_traffic_interval: 1s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: { path: /api/health }
      load_assignment:
        cluster_name: green
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: green-0, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: green-1, port_value: 8080 } } }
              - endpoint: { address: { socket_address: { address: green-2, port_value: 8080 } } }
