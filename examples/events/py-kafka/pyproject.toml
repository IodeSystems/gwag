[project]
name = "gwag-events-kafka-example"
version = "0.0.0"
description = "Typed gwag event channels from Python over Kafka (gwag-events-kafka) and the Schema Registry."
requires-python = ">=3.12"
dependencies = [
    "betterproto2==0.10.0",
    "gwag-events",
    "gwag-events-kafka",
    "gwag-events-schemaregistry",
]

[dependency-groups]
dev = [
    "betterproto2-compiler==0.10.1",
    "mypy==1.20.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gwag-events = { path = "../../../py/gwag-events", editable = true }
gwag-events-kafka = { path = "../../../py/gwag-events-kafka", editable = true }
gwag-events-schemaregistry = { path = "../../../py/gwag-events-schemaregistry", editable = true }

[tool.mypy]
strict = true
files = ["main.py", "srinterop.py", "corp.py"]
# ../py holds the generated orders code and the sample app;
# gen_corp/ and gen_shop/ are written by corp-gen.sh.
mypy_path = ".:../py"

# betterproto2's generated message_pool.py calls its untyped MessagePool().
[[tool.mypy.overrides]]
module = ["proto_gen.message_pool", "gen_corp.message_pool", "gen_shop.message_pool"]
disallow_untyped_calls = false

# aiokafka ships no type information.
[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true
