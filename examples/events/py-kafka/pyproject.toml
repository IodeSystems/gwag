[project]
name = "gwag-events-kafka-example"
version = "0.0.0"
description = "A Kafka Backend for the gwag Python events runtime (aiokafka). An example: copy it into your project."
requires-python = ">=3.12"
dependencies = [
    "aiokafka==0.13.0",
    "betterproto2==0.10.0",
    "gwag-events",
]

[dependency-groups]
dev = [
    "mypy==1.20.0",
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gwag-events = { path = "../../../py/gwag-events", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# ../py holds the generated orders code and the sample app.
pythonpath = [".", "../py"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["gwag_kafka.py", "main.py", "tests"]
mypy_path = "../py"

# betterproto2's generated message_pool.py calls its untyped MessagePool().
[[tool.mypy.overrides]]
module = "proto_gen.message_pool"
disallow_untyped_calls = false

# aiokafka ships no type information.
[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true
