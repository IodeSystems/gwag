[project]
name = "gwag-events-example"
version = "0.0.0"
description = "Typed gwag event channels from Python: generated code plus a JetStream program."
requires-python = ">=3.12"
dependencies = [
    "betterproto2==0.10.0",
    "gwag-events",
    "nats-py==2.16.0",
]

[dependency-groups]
dev = [
    "betterproto2-compiler==0.10.1",
    "mypy==1.20.0",
    "pytest==9.0.0",
    "pytest-asyncio==1.3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
gwag-events = { path = "../../../py/gwag-events", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["app.py", "main.py", "interop.py", "tests", "proto_gen"]

# betterproto2's own message_pool.py calls its untyped MessagePool().
# Generated by the pinned compiler; not ours to edit.
[[tool.mypy.overrides]]
module = "proto_gen.message_pool"
disallow_untyped_calls = false
